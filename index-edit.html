<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photo Albums</title>
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #fff; display: flex; height: 100vh; overflow: hidden; }
        .hidden { display: none !important; }

        /* MENU SCREEN STYLES */
        #menu-screen { width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #111; }
        .menu-grid { display: flex; gap: 20px; margin-top: 30px; flex-wrap: wrap; justify-content: center; }
        .menu-btn { padding: 20px 40px; background: #222; border: 2px solid #333; color: white; font-size: 1.25rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .menu-btn:hover { background: #0070f3; border-color: #0070f3; transform: translateY(-2px); }

        /* VIEWER SCREEN STYLES */
        .viewer { display: flex; width: 100vw; height: 100vh; }
        .photo-side { flex: 7; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; position: relative; }
        .photo-side img, .photo-side video { max-width: 100%; max-height: 85vh; object-fit: contain; }
        .video-play-overlay { position: absolute; top: 50%; left: 50%; width: 88px; height: 88px; transform: translate(-50%, -50%); display: grid; place-items: center; padding: 0 0 0 6px; background: rgba(0, 0, 0, 0.65); color: #fff; border: 2px solid rgba(255, 255, 255, 0.8); border-radius: 50%; font-size: 2.5rem; line-height: 1; cursor: pointer; box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45); }
        .video-play-overlay:hover { background: rgba(0, 112, 243, 0.9); }
        .caption-side { flex: 2; background: #1a1a1a; padding: 30px; display: flex; flex-direction: column; justify-content: flex-start; overflow: hidden; border-left: 1px solid #333; }
        .date-tag { color: #aaa; font-size: 1.4rem; font-weight: bold; margin-bottom: 4px; }
        .folder-tag { font-size: 1.4rem; color: #0070f3; font-weight: bold; margin-bottom: 5px; }
        .filename-label { color: #888; font-size: 0.85rem; margin-bottom: 18px; overflow-wrap: anywhere; }
        .caption-text { flex: 1 1 auto; font-size: 1.15rem; line-height: 1.6; margin-bottom: 30px; color: #eee; min-height: 60px; overflow-y: auto; }
        .day-selector { width: 100%; box-sizing: border-box; margin: 8px 0 18px; padding: 10px; background: #111; color: #fff; border: 1px solid #444; border-radius: 6px; font: inherit; }
        .comment-label { color: #aaa; font-size: 0.85rem; font-weight: bold; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px; }
        .comment-editor { width: 100%; min-height: 105px; box-sizing: border-box; resize: vertical; background: #111; color: #fff; border: 1px solid #444; border-radius: 6px; padding: 12px; font: inherit; line-height: 1.45; }
        .comment-editor:focus { outline: none; border-color: #0070f3; }
        .comment-status { color: #78d17c; font-size: 0.85rem; min-height: 1.3em; margin: 6px 0 16px; }
        .controls { display: flex; gap: 15px; }
        button.nav-btn { padding: 14px 28px; background: #0070f3; color: white; border: none; cursor: pointer; border-radius: 6px; font-size: 1.1rem; font-weight: bold; }
        button.nav-btn:hover { background: #0051a8; }
        button.home-btn { background: transparent; border: 1px solid #444; color: #aaa; margin-top: 40px; padding: 10px; cursor: pointer; border-radius: 4px; width: fit-content; }
        button.home-btn:hover { color: #fff; border-color: #666; }
        .comment-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
        .comment-tools button, .import-comments { background: transparent; border: 1px solid #444; color: #bbb; padding: 8px 10px; border-radius: 4px; cursor: pointer; font: inherit; font-size: 0.85rem; }
        .comment-tools button:hover, .import-comments:hover { color: #fff; border-color: #777; }
        .counter { position: absolute; bottom: 20px; left: 20px; color: #555; font-size: 0.9rem; }

        /* Tablets in portrait and phones: photo first, details underneath. */
        @media (max-width: 900px) and (orientation: portrait) {
            body { height: auto; min-height: 100vh; overflow: auto; }
            #viewer-screen.viewer { flex-direction: column; height: auto; min-height: 100vh; }
            .photo-side { flex: none; min-height: 58vh; padding: 12px; }
            .photo-side img, .photo-side video { max-height: 62vh; }
            .caption-side { flex: none; padding: 18px 24px; justify-content: flex-start; overflow: visible; border-left: none; border-top: 1px solid #333; }
            .caption-text { flex: none; overflow: visible; }
            .counter { bottom: 10px; left: 12px; }
        }

        /* Smaller phones: keep controls easy to tap and text comfortably sized. */
        @media (max-width: 600px) {
            #menu-screen { padding: 24px; box-sizing: border-box; text-align: center; }
            .menu-grid { margin-top: 20px; gap: 12px; }
            .menu-btn { width: 100%; padding: 16px 20px; }
            .photo-side { min-height: 62vh; }
            .photo-side img, .photo-side video { max-height: 68vh; }
            .video-play-overlay { width: 72px; height: 72px; font-size: 2rem; }
            .caption-side { padding: 16px 20px; }
            .date-tag, .folder-tag { font-size: 1.15rem; }
            .filename-label { margin-bottom: 10px; }
            .caption-text { margin-bottom: 14px; min-height: 0; }
            .controls { gap: 10px; }
            button.nav-btn { flex: 1; padding: 13px 10px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <!-- SCREEN 1: PHOTO ALBUM SELECTOR MENU -->
    <div id="menu-screen">
        <h1>My Photo Albums</h1>
        <div class="menu-grid" id="menu-options">
            <!-- Buttons will automatically generate here -->
        </div>
    </div>

    <!-- SCREEN 2: THE SLIDESHOW VIEWER -->
    <div id="viewer-screen" class="viewer hidden">
        <div class="photo-side">
            <img id="main-photo" src="" alt="Slideshow picture">
            <video id="main-video" controls preload="auto" class="hidden"></video>
            <button class="video-play-overlay hidden" id="video-play-overlay" type="button" onclick="playCurrentVideo()" aria-label="Play video">▶</button>
            <div class="counter" id="photo-counter">0 / 0</div>
        </div>

        <div class="caption-side">
            <div class="date-tag" id="date-label">Date</div>
            <div class="folder-tag" id="folder-label">Folder Name</div>
            <div class="filename-label" id="filename-label">Filename</div>
            <p class="caption-text" id="caption-label"></p>
            <label class="comment-label" for="day-selector">Jump to day</label>
            <select class="day-selector" id="day-selector" onchange="jumpToDay(this.value)"></select>
            <label class="comment-label" for="comment-editor">Your comment for this photo</label>
            <textarea class="comment-editor" id="comment-editor" placeholder="Type a memory, name, or note here…"></textarea>
            <div class="comment-status" id="comment-status" aria-live="polite"></div>
            
            <div class="controls">
                <button class="nav-btn" onclick="navigate(-1)">← Back</button>
                <button class="nav-btn" onclick="navigate(1)">Next →</button>
            </div>
            <div class="comment-tools">
                <button onclick="downloadCaptions()">Download comments</button>
                <label class="import-comments">Import comments<input type="file" id="caption-import" accept="application/json" class="hidden"></label>
            </div>
            <button class="home-btn" onclick="goHome()">🏠 Back to Photo Albums</button>
        </div>
    </div>

        let currentActiveSlides = [];
        let currentIndex = 0;
        const captionStorageKey = 'photo-albums-captions-v1';
        let savedCaptions = {};

        try {
            savedCaptions = JSON.parse(localStorage.getItem(captionStorageKey)) || {};
        } catch (error) {
            savedCaptions = {};
        }

        function currentCaption(slide) {
            return savedCaptions[slide.src] ?? slide.caption ?? '';
        }

        function saveCurrentCaption(showStatus = true) {
            if (!currentActiveSlides.length) return;
            const slide = currentActiveSlides[currentIndex];
            const text = document.getElementById('comment-editor').value;
            savedCaptions[slide.src] = text;
            localStorage.setItem(captionStorageKey, JSON.stringify(savedCaptions));
            document.getElementById('caption-label').innerText = text;
            if (showStatus) document.getElementById('comment-status').innerText = 'Saved automatically';
        }

        function initMenu() {
            const menuGrid = document.getElementById('menu-options');
            menuGrid.innerHTML = '';
            Object.keys(albums).forEach(key => {
                const btn = document.createElement('button');
                btn.className = 'menu-btn';
                btn.innerText = albums[key].title;
                btn.onclick = () => startSlideshow(key);
                menuGrid.appendChild(btn);
            });
        }

        function populateDaySelector() {
            const selector = document.getElementById('day-selector');
            const days = [...new Set(currentActiveSlides.map(slide => slide.day.split(' — ')[0]))];
            selector.innerHTML = days.map(day => `<option value="${day}">${day}</option>`).join('');
        }

        function jumpToDay(day) {
            const firstSlideOfDay = currentActiveSlides.findIndex(slide => slide.day.split(' — ')[0] === day);
            if (firstSlideOfDay >= 0) {
                currentIndex = firstSlideOfDay;
                displayMedia();
            }
        }

        function startSlideshow(albumKey) {
            currentActiveSlides = albums[albumKey].slides;
            currentIndex = 0;
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('viewer-screen').classList.remove('hidden');
            populateDaySelector();
            displayMedia();
        }

        function displayMedia() {
            if (!currentActiveSlides.length) return;
            const slide = currentActiveSlides[currentIndex];
            const imgTag = document.getElementById('main-photo');
            const videoTag = document.getElementById('main-video');
            const videoPlayOverlay = document.getElementById('video-play-overlay');
            videoTag.pause();

            if (slide.src.toLowerCase().endsWith('.mp4')) {
                imgTag.classList.add('hidden');
                videoTag.src = slide.src;
                videoTag.load();
                videoTag.classList.remove('hidden');
                videoPlayOverlay.classList.remove('hidden');
            } else {
                videoTag.classList.add('hidden');
                imgTag.classList.remove('hidden');
                imgTag.src = slide.src;
                videoPlayOverlay.classList.add('hidden');
            }

            const dayParts = slide.day.split(' — ');
            document.getElementById('date-label').innerText = dayParts.shift();
            document.getElementById('folder-label').innerText = dayParts.join(' — ');
            document.getElementById('filename-label').innerText = slide.src.split('/').pop();
            document.getElementById('caption-label').innerText = currentCaption(slide);
            document.getElementById('day-selector').value = dayParts[0];
            document.getElementById('comment-editor').value = currentCaption(slide);
            document.getElementById('comment-status').innerText = '';
            document.getElementById('photo-counter').innerText = `${currentIndex + 1} / ${currentActiveSlides.length}`;
        }

        function playCurrentVideo() {
            document.getElementById('main-video').play();
        }

        function navigate(direction) {
            if (!currentActiveSlides.length) return;
            currentIndex += direction;
            if (currentIndex >= currentActiveSlides.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = currentActiveSlides.length - 1;
            displayMedia();
        }

        function goHome() {
            document.getElementById('main-video').pause();
            document.getElementById('viewer-screen').classList.add('hidden');
            document.getElementById('menu-screen').classList.remove('hidden');
        }

        function downloadCaptions() {
            const activePaths = new Set(currentActiveSlides.map(slide => slide.src));
            const albumCaptions = Object.fromEntries(
                Object.entries(savedCaptions).filter(([path]) => activePaths.has(path))
            );
            const backup = new Blob([JSON.stringify(albumCaptions, null, 2)], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(backup);
            const albumFolderName = currentActiveSlides[0]?.src.split('/')[0] || 'photo-albums';
            const albumFileName = albumFolderName.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
            link.download = `${albumFileName}-comments.json`;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        document.getElementById('comment-editor').addEventListener('input', () => saveCurrentCaption());
        document.getElementById('caption-import').addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const imported = JSON.parse(reader.result);
                    if (!imported || Array.isArray(imported) || typeof imported !== 'object') throw new Error('Invalid file');
                    savedCaptions = { ...savedCaptions, ...imported };
                    localStorage.setItem(captionStorageKey, JSON.stringify(savedCaptions));
                    displayMedia();
                    document.getElementById('comment-status').innerText = 'Comments imported';
                } catch (error) {
                    document.getElementById('comment-status').innerText = 'That file could not be imported';
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        });

        document.addEventListener('keydown', (e) => {
            if (document.getElementById('viewer-screen').classList.contains('hidden')) return;
            if (e.key === 'ArrowRight') navigate(1);
            if (e.key === 'ArrowLeft') navigate(-1);
            if (e.key === 'Escape') goHome();
        });

        document.getElementById('main-video').addEventListener('play', () => {
            document.getElementById('video-play-overlay').classList.add('hidden');
        });

        document.getElementById('main-video').addEventListener('ended', () => {
            document.getElementById('video-play-overlay').classList.remove('hidden');
        });

        initMenu();
    </script>
